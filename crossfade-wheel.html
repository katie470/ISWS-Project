<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CROSSFADE — Drug Interaction Wheel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --border: #2a2a32;
      --text: #f0f0f5;
      --muted: #888899;
      --accent: #ff3c6e;
      --font: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ──────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ff3c6e, #ff8c42, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    header p {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 0.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* ── Wheels Container ─────────────────────── */
    .wheels-row {
      display: flex;
      gap: 3rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .wheel-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
    }

    .wheel-container canvas {
      border-radius: 50%;
      display: block;
      filter: drop-shadow(0 0 20px rgba(255, 60, 110, 0.3));
    }

    /* Pointer triangle at top */
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid #ffffff;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
      z-index: 10;
    }

    /* vs separator */
    .vs {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -1px;
      text-shadow: 0 0 20px rgba(255,60,110,0.6);
      align-self: center;
    }

    /* ── Button ───────────────────────────────── */
    .btn-crossfade {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #ff3c6e, #ff8c42);
      color: #fff;
      border: none;
      border-radius: 60px;
      padding: 1.1rem 3rem;
      font-family: var(--font);
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 30px rgba(255, 60, 110, 0.5);
      margin-bottom: 2.5rem;
    }

    .btn-crossfade:hover { transform: scale(1.05); box-shadow: 0 6px 40px rgba(255,60,110,0.7); }
    .btn-crossfade:active { transform: scale(0.97); }
    .btn-crossfade:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* spinning icon */
    .btn-icon {
      font-size: 1.4rem;
      display: inline-block;
    }
    .spinning { animation: spin-icon 0.6s linear infinite; }
    @keyframes spin-icon { to { transform: rotate(360deg); } }

    /* ── Result Panel ─────────────────────────── */
    #result-panel {
      width: 100%;
      max-width: 680px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    #result-panel.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .combo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .combo-pill {
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      background: var(--surface);
      border: 2px solid var(--border);
      transition: border-color 0.3s;
    }

    .combo-plus {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent);
      animation: pulse-plus 0.6s ease-out;
    }

    @keyframes pulse-plus {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Risk Card */
    .risk-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      animation: slide-up 0.4s ease-out 0.3s both;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .risk-level {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .risk-low      { background: rgba(34,197,94,0.15);  color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .risk-moderate { background: rgba(234,179,8,0.15);  color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
    .risk-high     { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }
    .risk-dangerous{ background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

    .risk-card h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }

    .risk-card .summary {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #d0d0da;
      margin-bottom: 1.2rem;
    }

    .effects-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .effects-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.95rem;
      line-height: 1.55;
      color: #c8c8d8;
    }

    .effects-list li::before {
      content: '▸';
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .sos-bar {
      margin-top: 1.4rem;
      padding: 0.9rem 1.2rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #fca5a5;
      line-height: 1.55;
    }

    .sos-bar strong { color: #ef4444; }

    /* ── Footer ──────────────────────────────── */
    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 640px) {
      .wheels-row { gap: 1.5rem; }
      .vs { display: none; }
      .wheel-container { width: 220px; height: 220px; }
    }
  </style>
</head>

/* ═══════════════════════════════════════════
   WHEEL DRAWING
═══════════════════════════════════════════ */
const COUNT = SUBSTANCES.length;
const SLICE = (2 * Math.PI) / COUNT;

// rotation state for each wheel (radians)
const rotations = [0, 0];

function drawWheel(canvasId, rotation) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const r = cx - 6;

  ctx.clearRect(0, 0, W, H);

  // Draw slices
  for (let i = 0; i < COUNT; i++) {
    const startAngle = rotation + i * SLICE;
    const endAngle = startAngle + SLICE;

    // Slice fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = SUBSTANCES[i].color;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + SLICE / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#000000";
    ctx.font = `bold ${W <= 220 ? 9 : 11}px Inter, Arial, sans-serif`;
    ctx.shadowColor = "rgba(255,255,255,0.5)";
    ctx.shadowBlur = 2;

    const labelR = r * 0.78;
    // Emoji
    ctx.font = `${W <= 220 ? 14 : 16}px Arial`;
    ctx.fillText(SUBSTANCES[i].emoji, labelR - 2, 4);
    // Name
    ctx.font = `bold ${W <= 220 ? 9 : 10.5}px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#111";
    ctx.fillText(SUBSTANCES[i].name, labelR - 22, 4);

    ctx.restore();
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, 2 * Math.PI);
  ctx.fillStyle = "#0d0d0f";
  ctx.fill();
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function initWheels() {
  drawWheel("wheel1", rotations[0]);
  drawWheel("wheel2", rotations[1]);
}

/* ═══════════════════════════════════════════
   EASING
═══════════════════════════════════════════ */
function easeOut(t) {
  return 1 - Math.pow(1 - t, 4);
}

/* ═══════════════════════════════════════════
   SPIN LOGIC
═══════════════════════════════════════════ */
// Wheel pointer is at the TOP (- PI/2 in canvas coords)
// The "selected" slice is the one that the pointer lands in.
//
// After rotation R, slice i occupies angles [R + i*SLICE, R + (i+1)*SLICE].
// The pointer at -PI/2 hits slice i when:
//   R + i*SLICE <= -PI/2 (mod 2PI) < R + (i+1)*SLICE
//
// So to land on slice i, we need R such that:
//   -PI/2 is inside [R + i*SLICE, R + (i+1)*SLICE]
//
// We choose a target rotation that puts the pointer on slice i:
//   R = -PI/2 - (i + 0.5) * SLICE  (center of slice under pointer)
//   plus extra full rotations for drama.

function targetRotationForSlice(sliceIndex, extraSpins) {
  const pointerAngle = -Math.PI / 2;
  const baseTarget = pointerAngle - (sliceIndex + 0.5) * SLICE;
  return baseTarget - extraSpins * 2 * Math.PI;
}

function getSliceAtRotation(rotation) {
  const pointerAngle = -Math.PI / 2;
  // normalize pointer position in wheel frame
  let angle = ((pointerAngle - rotation) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(angle / SLICE) % COUNT;
}

let isSpinning = false;

function spinWheels() {
  if (isSpinning) return;
  isSpinning = true;

  // Hide previous result
  const panel = document.getElementById("result-panel");
  panel.classList.remove("visible");

  // Disable button, show spinner
  const btn = document.getElementById("spinBtn");
  const icon = document.getElementById("btnIcon");
  btn.disabled = true;
  icon.textContent = "🎰";
  icon.classList.add("spinning");

  // Pick two different random substances
  const idx1 = Math.floor(Math.random() * COUNT);
  let idx2;
  do { idx2 = Math.floor(Math.random() * COUNT); } while (idx2 === idx1);

  // Choose extra spins (different for each wheel for visual variety)
  const spins1 = 5 + Math.floor(Math.random() * 4); // 5–8 full spins
  const spins2 = 5 + Math.floor(Math.random() * 4);

  const finalRot1 = targetRotationForSlice(idx1, spins1);
  const finalRot2 = targetRotationForSlice(idx2, spins2);

  const startRot1 = rotations[0];
  const startRot2 = rotations[1];

  // Slightly different durations
  const dur1 = 3200 + Math.random() * 1200;
  const dur2 = 3400 + Math.random() * 1200;
  const maxDur = Math.max(dur1, dur2);

  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;

    const t1 = Math.min(elapsed / dur1, 1);
    const t2 = Math.min(elapsed / dur2, 1);

    rotations[0] = startRot1 + (finalRot1 - startRot1) * easeOut(t1);
    rotations[1] = startRot2 + (finalRot2 - startRot2) * easeOut(t2);

    drawWheel("wheel1", rotations[0]);
    drawWheel("wheel2", rotations[1]);

    if (elapsed < maxDur) {
      requestAnimationFrame(animate);
    } else {
      // Snap to exact final rotations
      rotations[0] = finalRot1;
      rotations[1] = finalRot2;
      drawWheel("wheel1", rotations[0]);
      drawWheel("wheel2", rotations[1]);

      isSpinning = false;
      btn.disabled = false;
      icon.textContent = "🎲";
      icon.classList.remove("spinning");

      showResult(idx1, idx2);
    }
  }

  requestAnimationFrame(animate);
}

/* ═══════════════════════════════════════════
   RESULT DISPLAY
═══════════════════════════════════════════ */
function makeKey(a, b) {
  const names = [SUBSTANCES[a].name.toLowerCase(), SUBSTANCES[b].name.toLowerCase()];
  // normalize "benzos" key match
  const normalize = s => s.replace("benzodiazepines", "benzos");
  return names.map(normalize).sort().join("+");
}

const RISK_META = {
  low:       { label: "Low Risk",       cls: "risk-low",       icon: "🟢" },
  moderate:  { label: "Moderate Risk",  cls: "risk-moderate",  icon: "🟡" },
  high:      { label: "High Risk",      cls: "risk-high",      icon: "🟠" },
  dangerous: { label: "DANGEROUS",      cls: "risk-dangerous", icon: "🔴" },
};

function showResult(idx1, idx2) {
  const s1 = SUBSTANCES[idx1];
  const s2 = SUBSTANCES[idx2];

  const key = makeKey(idx1, idx2);
  const data = INTERACTIONS[key] || {
    risk: "moderate",
    title: `${s1.name} + ${s2.name} — Limited Data`,
    summary: `There isn't a lot of research on mixing ${s1.name.toLowerCase()} and ${s2.name.toLowerCase()} specifically. But combining any two drugs is riskier than using either alone. Your body is processing two different chemicals at the same time, and effects can be unpredictable.`,
    effects: [
      "Both drugs compete for your liver's attention — increasing side effects",
      "Judgment and coordination are worse with any drug combination",
      "It's harder to know which drug is causing a bad reaction",
      "Overdose threshold can be lower when drugs interact",
    ],
    sos: "When in doubt, don't mix. If something feels wrong, get help. Call 911 or Poison Control (1-800-222-1222).",
  };

  const risk = RISK_META[data.risk] || RISK_META.moderate;

  // Combo header
  const header = document.getElementById("comboHeader");
  header.innerHTML = `
    <span class="combo-pill" style="border-color:${s1.color}; color:${s1.color}">
      ${s1.emoji} ${s1.name}
    </span>
    <span class="combo-plus">+</span>
    <span class="combo-pill" style="border-color:${s2.color}; color:${s2.color}">
      ${s2.emoji} ${s2.name}
    </span>
  `;

  // Effects list
  const effectsHtml = data.effects
    ? `<ul class="effects-list">${data.effects.map(e => `<li>${e}</li>`).join("")}</ul>`
    : "";

  // SOS bar
  const sosHtml = data.sos
    ? `<div class="sos-bar"><strong>⚠️ If something goes wrong:</strong> ${data.sos}</div>`
    : "";

  // Risk card
  const card = document.getElementById("riskCard");
  card.innerHTML = `
    <div class="risk-level ${risk.cls}">${risk.icon} ${risk.label}</div>
    <h2>${data.title}</h2>
    <p class="summary">${data.summary}</p>
    ${effectsHtml}
    ${sosHtml}
  `;

  // Show panel
  const panel = document.getElementById("result-panel");
  requestAnimationFrame(() => {
    panel.classList.add("visible");
    setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "start" }), 200);
  });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
window.addEventListener("DOMContentLoaded", () => {
  // Offset initial rotations so labels don't all start at exactly 0
  rotations[0] = -Math.PI / 2 - SLICE * 0.5; // slight offset so a label doesn't sit on the pointer
  rotations[1] = -Math.PI / 2 - SLICE * 0.5;
  initWheels();
});

// Redraw on resize
window.addEventListener("resize", () => {
  drawWheel("wheel1", rotations[0]);
  drawWheel("wheel2", rotations[1]);
});
</script>
