<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISWS Logo Export</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
      min-height: 100vh;
      padding: 60px 40px;
      font-family: 'Inter', sans-serif;
    }

    .label {
      color: rgba(255,255,255,0.3);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── MARK ONLY ── */
    .logo-mark-only svg {
      width: 80px;
      height: 80px;
    }

    /* ── FULL LOGO HORIZONTAL ── */
    .logo-full {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo-full svg {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }
    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .wordmark-isws {
      font-weight: 700;
      font-size: 1.5rem;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
    }
    .wordmark-full {
      font-weight: 300;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── FULL LOGO STACKED ── */
    .logo-stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }
    .logo-stacked svg {
      width: 72px;
      height: 72px;
    }
    .wordmark-stacked-isws {
      font-weight: 700;
      font-size: 1.6rem;
      color: #ffffff;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
    }
    .wordmark-stacked-full {
      font-weight: 300;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── LIGHT BG VERSION ── */
    .light-bg {
      background: #f9fafb;
      padding: 30px 40px;
      border-radius: 8px;
    }
    .light-bg .wordmark-isws,
    .light-bg .wordmark-stacked-isws { color: #111827; }
    .light-bg .wordmark-full,
    .light-bg .wordmark-stacked-full { color: rgba(17,24,39,0.5); }

    .divider {
      width: 100%;
      max-width: 500px;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* Shared SVG mark — inline via symbol trick */
    .logo-svg-inner { display: contents; }
  </style>
</head>
<body>

  <!-- 1. Mark only -->
  <div>
    <div class="label">Mark only</div>
    <div class="logo-mark-only">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="17.5" stroke="#14a8ad" stroke-width="1.5"/>
        <line x1="19" y1="7"  x2="29" y2="14" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="29" y1="14" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="26" y1="26" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="13" y1="27" x2="9"  y2="15" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="9"  y1="15" x2="19" y2="7"  stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="19" y1="7"  x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="29" y1="14" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="9"  y1="15" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <circle cx="19" cy="7"  r="2.2" fill="#14a8ad"/>
        <circle cx="29" cy="14" r="1.6" fill="#D4A853"/>
        <circle cx="26" cy="26" r="2.0" fill="#14a8ad" opacity="0.85"/>
        <circle cx="13" cy="27" r="1.4" fill="#E8644A"/>
        <circle cx="9"  cy="15" r="1.8" fill="#14a8ad" opacity="0.7"/>
      </svg>
    </div>
  </div>

  <hr class="divider"/>

  <!-- 2. Horizontal lockup — dark -->
  <div>
    <div class="label">Horizontal lockup — dark</div>
    <div class="logo-full">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="17.5" stroke="#14a8ad" stroke-width="1.5"/>
        <line x1="19" y1="7"  x2="29" y2="14" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="29" y1="14" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="26" y1="26" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="13" y1="27" x2="9"  y2="15" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="9"  y1="15" x2="19" y2="7"  stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="19" y1="7"  x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="29" y1="14" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="9"  y1="15" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <circle cx="19" cy="7"  r="2.2" fill="#14a8ad"/>
        <circle cx="29" cy="14" r="1.6" fill="#D4A853"/>
        <circle cx="26" cy="26" r="2.0" fill="#14a8ad" opacity="0.85"/>
        <circle cx="13" cy="27" r="1.4" fill="#E8644A"/>
        <circle cx="9"  cy="15" r="1.8" fill="#14a8ad" opacity="0.7"/>
      </svg>
      <div class="wordmark">
        <div class="wordmark-isws">ISWS</div>
        <div class="wordmark-full">International School Wellness Survey</div>
      </div>
    </div>
  </div>

  <hr class="divider"/>

  <!-- 3. Stacked lockup — dark -->
  <div>
    <div class="label">Stacked lockup — dark</div>
    <div class="logo-stacked">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="17.5" stroke="#14a8ad" stroke-width="1.5"/>
        <line x1="19" y1="7"  x2="29" y2="14" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="29" y1="14" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="26" y1="26" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="13" y1="27" x2="9"  y2="15" stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="9"  y1="15" x2="19" y2="7"  stroke="#14a8ad" stroke-width="0.9" opacity="0.6"/>
        <line x1="19" y1="7"  x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="29" y1="14" x2="13" y2="27" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <line x1="9"  y1="15" x2="26" y2="26" stroke="#14a8ad" stroke-width="0.7" opacity="0.3"/>
        <circle cx="19" cy="7"  r="2.2" fill="#14a8ad"/>
        <circle cx="29" cy="14" r="1.6" fill="#D4A853"/>
        <circle cx="26" cy="26" r="2.0" fill="#14a8ad" opacity="0.85"/>
        <circle cx="13" cy="27" r="1.4" fill="#E8644A"/>
        <circle cx="9"  cy="15" r="1.8" fill="#14a8ad" opacity="0.7"/>
      </svg>
      <div>
        <div class="wordmark-stacked-isws">ISWS</div>
        <div class="wordmark-stacked-full">International School Wellness Survey</div>
      </div>
    </div>
  </div>

  <hr class="divider"/>

  <!-- 4. Horizontal lockup — light bg -->
  <div>
    <div class="label">Horizontal lockup — light background</div>
    <div class="logo-full light-bg">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="19" r="17.5" stroke="#0D7377" stroke-width="1.5"/>
        <line x1="19" y1="7"  x2="29" y2="14" stroke="#0D7377" stroke-width="0.9" opacity="0.6"/>
        <line x1="29" y1="14" x2="26" y2="26" stroke="#0D7377" stroke-width="0.9" opacity="0.6"/>
        <line x1="26" y1="26" x2="13" y2="27" stroke="#0D7377" stroke-width="0.9" opacity="0.6"/>
        <line x1="13" y1="27" x2="9"  y2="15" stroke="#0D7377" stroke-width="0.9" opacity="0.6"/>
        <line x1="9"  y1="15" x2="19" y2="7"  stroke="#0D7377" stroke-width="0.9" opacity="0.6"/>
        <line x1="19" y1="7"  x2="26" y2="26" stroke="#0D7377" stroke-width="0.7" opacity="0.3"/>
        <line x1="29" y1="14" x2="13" y2="27" stroke="#0D7377" stroke-width="0.7" opacity="0.3"/>
        <line x1="9"  y1="15" x2="26" y2="26" stroke="#0D7377" stroke-width="0.7" opacity="0.3"/>
        <circle cx="19" cy="7"  r="2.2" fill="#0D7377"/>
        <circle cx="29" cy="14" r="1.6" fill="#D4A853"/>
        <circle cx="26" cy="26" r="2.0" fill="#0D7377" opacity="0.85"/>
        <circle cx="13" cy="27" r="1.4" fill="#E8644A"/>
        <circle cx="9"  cy="15" r="1.8" fill="#0D7377" opacity="0.7"/>
      </svg>
      <div class="wordmark">
        <div class="wordmark-isws">ISWS</div>
        <div class="wordmark-full">International School Wellness Survey</div>
      </div>
    </div>
  </div>

</body>
</html>
